<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f46">
<meta name="description" content="TCC-I na Prática Clínica — livro clínico integral para psicólogos">
<title>TCC-I na Prática Clínica</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ea}#book{display:block;width:100%;height:100%;border:0;background:#f5f1ea}
</style>
</head>
<body>
<iframe id="book" title="TCC-I na Prática Clínica"></iframe>
<script>
(() => {
  const frame = document.getElementById('book');
  const BASE = 'index.before-audio.html';
  const SIGNATURE = '<strong>Richelmy Murta</strong> · Psicólogo Clínico · Especialista em Terapia Cognitivo-Comportamental';
  let token = 0;
  let audio = { chapter:'', chunks:[], index:0, playing:false, paused:false, win:null };

  function cleanText(s){ return (s || '').replace(/\s+/g,' ').trim(); }
  function currentChapter(win){
    const m = (win.location.hash || '').match(/^#cap-(\d{1,2})$/);
    if(!m) return null;
    const n = Number(m[1]);
    return n >= 1 && n <= 28 ? n : null;
  }
  function injectStyles(doc){
    if(doc.getElementById('tcci-audio-style')) return;
    const style = doc.createElement('style');
    style.id = 'tcci-audio-style';
    style.textContent = `
      .audio-guide{margin:0 0 26px;padding:18px 20px;border:1px solid #c9d9d7;border-radius:16px;background:#f2f7f6;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f292d}
      .audio-guide-top{display:flex;align-items:flex-start;gap:12px}
      .audio-guide-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#173f46;color:#fff;font-size:1.1rem;flex:0 0 auto}
      .audio-guide-kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.11em;font-weight:900;color:#c58c43;margin-bottom:2px}
      .audio-guide-title{font-size:1rem;font-weight:850;color:#173f46;line-height:1.25}
      .audio-guide-desc{margin:8px 0 13px!important;font-size:.88rem;line-height:1.5;color:#657278}
      .audio-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
      .audio-btn{border:0;border-radius:999px;padding:9px 13px;font:inherit;font-size:.84rem;font-weight:800;cursor:pointer}
      .audio-btn.play{background:#173f46;color:#fff}.audio-btn.stop{background:transparent;color:#173f46;border:1px solid #9fb3b5}
      .audio-status{font-size:.8rem;color:#657278}
      .footer strong{color:#173f46}.footer-sub{opacity:.82}
      @media(max-width:560px){.audio-guide{padding:16px}.audio-status{width:100%}}
      @media print{.audio-guide{display:none!important}}
    `;
    doc.head.appendChild(style);
  }
  function updateFooters(doc){
    const footers = [...doc.querySelectorAll('.footer')];
    footers.forEach((f,i) => {
      const sub = i === 0 ? 'TCC-I na Prática Clínica · versão 1.0 · 2026' : 'Leitura clínica · progresso salvo neste navegador';
      f.innerHTML = SIGNATURE + '<br><span class="footer-sub">' + sub + '</span>';
    });
  }
  function makeScript(doc, chapter){
    const article = doc.getElementById('article');
    const title = cleanText(doc.getElementById('title')?.textContent) || ('Capítulo ' + chapter);
    if(!article) return 'Capítulo ' + chapter + ': ' + title + '.';
    const clone = article.cloneNode(true);
    clone.querySelectorAll('.audio-guide,.read-complete').forEach(n => n.remove());
    const paras = [...clone.querySelectorAll('p')].map(p => cleanText(p.textContent)).filter(t => t.length > 45);
    const headings = [...clone.querySelectorAll('h2,h3')];
    const used = new Set();
    const pieces = [`Neste áudio explicativo, vamos revisar os principais pontos do capítulo ${chapter}, ${title}. O objetivo é organizar os conceitos centrais e destacar como eles se conectam ao raciocínio clínico em TCC-I.`];
    paras.slice(0,2).forEach(p => { pieces.push(p); used.add(p); });
    headings.slice(0,8).forEach(h => {
      const ht = cleanText(h.textContent);
      let n = h.nextElementSibling, p = '';
      while(n){
        if(n.tagName === 'P'){ p = cleanText(n.textContent); break; }
        if(/^H[23]$/.test(n.tagName)) break;
        n = n.nextElementSibling;
      }
      if(ht && p && p.length > 45){ pieces.push(`Um ponto importante é ${ht}. ${p}`); used.add(p); }
    });
    let text = pieces.join(' ');
    let count = text.split(/\s+/).filter(Boolean).length;
    for(const p of paras){
      if(count >= 430) break;
      if(used.has(p)) continue;
      text += ' ' + p;
      count = text.split(/\s+/).filter(Boolean).length;
    }
    const words = text.split(/\s+/).filter(Boolean).slice(0,430);
    return words.join(' ') + (count > 430 ? '…' : '');
  }
  function chunks(text, max=250){
    const sentences = text.match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g) || [text];
    const out=[]; let buf='';
    for(const s0 of sentences){
      const s = cleanText(s0);
      if(!s) continue;
      if((buf + ' ' + s).trim().length <= max) buf = (buf + ' ' + s).trim();
      else { if(buf) out.push(buf); if(s.length <= max) buf=s; else { for(let i=0;i<s.length;i+=max) out.push(s.slice(i,i+max)); buf=''; } }
    }
    if(buf) out.push(buf);
    return out;
  }
  function ui(win, message){
    const doc = win?.document; if(!doc) return;
    const play = doc.getElementById('tcciAudioPlay');
    const status = doc.getElementById('tcciAudioStatus');
    if(play){
      if(audio.playing && audio.paused) play.textContent = '▶ Continuar';
      else if(audio.playing) play.textContent = '⏸ Pausar';
      else play.textContent = '▶ Ouvir áudio';
    }
    if(status && message) status.textContent = message;
  }
  function stopAudio(message='Pronto para ouvir.'){
    token++;
    try{ window.speechSynthesis.cancel(); }catch(e){}
    const w = audio.win;
    audio = { chapter:'', chunks:[], index:0, playing:false, paused:false, win:null };
    if(w) ui(w,message);
  }
  function speakNext(myToken){
    if(myToken !== token || !audio.playing) return;
    if(audio.index >= audio.chunks.length){
      const w=audio.win; audio.playing=false; audio.paused=false; ui(w,'Áudio concluído.'); return;
    }
    const u = new SpeechSynthesisUtterance(audio.chunks[audio.index]);
    u.lang='pt-BR'; u.rate=1.02; u.pitch=1;
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(x => /^pt-BR$/i.test(x.lang)) || voices.find(x => /^pt/i.test(x.lang));
    if(v) u.voice=v;
    u.onend=()=>{ if(myToken!==token || !audio.playing) return; audio.index++; speakNext(myToken); };
    u.onerror=(e)=>{ if(myToken!==token || e.error==='canceled' || e.error==='interrupted') return; const w=audio.win; audio.playing=false; audio.paused=false; ui(w,'Não foi possível reproduzir o áudio neste navegador.'); };
    window.speechSynthesis.speak(u);
  }
  function toggleAudio(win, chapter){
    if(!('speechSynthesis' in window)){ ui(win,'Seu navegador não oferece síntese de voz.'); return; }
    if(audio.playing && audio.chapter === String(chapter)){
      if(audio.paused){ window.speechSynthesis.resume(); audio.paused=false; ui(win,'Reproduzindo resumo do capítulo…'); }
      else { window.speechSynthesis.pause(); audio.paused=true; ui(win,'Áudio pausado.'); }
      return;
    }
    stopAudio();
    const text = makeScript(win.document, chapter);
    audio = { chapter:String(chapter), chunks:chunks(text), index:0, playing:true, paused:false, win };
    token++;
    const myToken=token;
    ui(win,'Reproduzindo resumo do capítulo…');
    speakNext(myToken);
  }
  function enhance(win){
    const doc = win.document;
    injectStyles(doc); updateFooters(doc);
    const chapter = currentChapter(win);
    const article = doc.getElementById('article');
    if(chapter && article && !doc.getElementById('tcciAudioGuide')){
      const box = doc.createElement('section');
      box.id='tcciAudioGuide'; box.className='audio-guide'; box.setAttribute('aria-label','Áudio explicativo do capítulo');
      box.innerHTML = `<div class="audio-guide-top"><div class="audio-guide-icon" aria-hidden="true">♪</div><div><div class="audio-guide-kicker">Áudio explicativo</div><div class="audio-guide-title">Resumo narrado do capítulo ${chapter}</div><p class="audio-guide-desc">Cerca de 3 minutos, com os conceitos e decisões clínicas centrais deste capítulo.</p></div></div><div class="audio-controls"><button id="tcciAudioPlay" class="audio-btn play" type="button">▶ Ouvir áudio</button><button id="tcciAudioStop" class="audio-btn stop" type="button">■ Parar</button><span id="tcciAudioStatus" class="audio-status" aria-live="polite">Pronto para ouvir.</span></div>`;
      article.prepend(box);
      doc.getElementById('tcciAudioPlay').onclick=()=>toggleAudio(win,chapter);
      doc.getElementById('tcciAudioStop').onclick=()=>stopAudio('Áudio interrompido.');
    }
    document.title = doc.title || 'TCC-I na Prática Clínica';
  }
  function syncFromFrame(win){
    const h = win.location.hash || '';
    if(location.hash !== h) history.replaceState(null,'',location.pathname + location.search + h);
  }
  frame.addEventListener('load', () => {
    const win = frame.contentWindow;
    enhance(win); syncFromFrame(win);
    win.addEventListener('hashchange', () => {
      stopAudio();
      setTimeout(() => { enhance(win); syncFromFrame(win); }, 0);
    });
    const art = win.document.getElementById('article');
    if(art){ new MutationObserver(() => setTimeout(() => enhance(win),0)).observe(art,{childList:true}); }
  });
  window.addEventListener('hashchange', () => {
    const win=frame.contentWindow;
    if(win && win.location.hash !== location.hash) win.location.hash = location.hash;
  });
  frame.src = BASE + (location.hash || '');
  window.addEventListener('beforeunload',()=>stopAudio());
})();
</script>
</body>
</html>
